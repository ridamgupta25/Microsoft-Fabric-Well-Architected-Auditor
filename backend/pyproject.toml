[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditfast"
version = "0.4.0"
description = "Microsoft Fabric Well-Architected Auditing Platform — API, engine and CLI"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Fabric access + auth
    "msal>=1.28",
    "requests>=2.31",
    "pyodbc>=5.1",
    # Domain / reporting
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# MCP adapter — exposes the same services to mcp-inspector or an agent.
# Pinned to the 1.x line: the server uses mcp.server.fastmcp.FastMCP, which the
# 2.0 SDK renamed to MCPServer and relocated.
mcp = ["mcp>=1.2,<2"]
# Persistence — audit history, scheduled runs, multi-tenant. Not yet wired up.
db = ["sqlalchemy>=2.0", "alembic>=1.13", "asyncpg>=0.29"]
# Future AI layer. Imported lazily so the core never depends on it.
ai = ["openai>=1.40", "tiktoken>=0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
auditfast = "auditfast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # long lines are a formatter concern, not a hard error
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Check modules are imported purely to trigger decorator registration.
"src/auditfast/**/__init__.py" = ["F401"]
