# AuditFAST Core - project definition (Phase 1)
# One project can span several Fabric workspaces; tag each with its layer role.
project:
  name: "Sales Analytics - Fabric Migration"
  client: "Contoso"
  # Best-practice conventions the checks enforce (edit per engagement):
  naming_convention: '^[A-Za-z]+-(Dev|Test|Prod)-[A-Za-z]+$'   # e.g. Sales-Prod-DataPrep
  pipeline_naming_convention: '^PL_[A-Za-z0-9_]+$'             # e.g. PL_Bronze_Load
  orphan_days: 90
  max_admins: 2
  minimum_spark_version: "3.5"
  minimum_spark_core_efficiency: 0.5
  maximum_spark_idle_ratio: 0.3
  heavy_shuffle_bytes: 1073741824
  long_running_notebook_ms: 300000

  # -- elevated ("admin") checks -------------------------------------------
  # These name things Fabric cannot tell us: which workspaces are production,
  # and which security groups are the developers / operations / report readers.
  # Each list is empty by default, and a check with nothing to compare against
  # reports N/A rather than guessing - the same way the source notebooks do
  # ("none named, so 11.3.2 will not score").
  #
  # Names are matched case-insensitively against the role assignment's display
  # name, exactly as shown in Fabric's Manage access pane.
  production_workspaces: []      # e.g. ["MLC_DATASTORE_PROD", "Sales-Prod-Reporting"]
  developer_groups: []           # e.g. ["SG-Fabric-Developers"]
  operations_groups: []          # e.g. ["SG-Fabric-Operations"]
  report_consumer_groups: []     # e.g. ["SG-Sales-Report-Readers"]
  # Reviewer attestation for 14.4.4: app audiences are not readable from the
  # Fabric API, so full marks need a human to confirm they were checked by hand.
  app_access_reviewed: false
  # Reviewer attestation for 1.3.8: the gateways API reports membership and
  # version, never machine capacity, so sizing has to be confirmed by whoever
  # runs the box.
  gateway_sizing_confirmed: false
  # Reviewer attestation for 1.3.7: connections are only half that point. A
  # secret pasted into notebook or pipeline code never becomes a connection, so
  # it is invisible to the connection scan - set this once the code scan
  # (NB-SECRETS 3.1.3 / PL-SECRETS 6.4.2) has come back clean.
  code_scan_clean: false

remediation: "config/remediation.yaml"

# The workspaces that make up this project, each tagged with a layer role.
workspaces:
  - id: "ws-prep-01"
    role: "Data Prep"
  - id: "ws-store-01"
    role: "Data Storage"
  - id: "ws-ops-01"
    role: "Data Operations"

# Entra app registration for signing in (optional — the CLI and API both fall
# back to Microsoft's first-party Azure CLI client if this is unset).
#
# IMPORTANT: the built-in Azure CLI client CANNOT read item *definitions*.
# Reading notebook / pipeline / semantic-model CODE goes through the Fabric
# getDefinition API, which requires the Item.ReadWrite.All scope — a scope the
# built-in client does not grant (you will see getDefinition return HTTP 401).
# To read code, register your own Entra app, add the delegated scopes below,
# consent to it, and set its tenant_id + client_id here.
auth:
  tenant_id: "<TENANT_ID>"
  client_id: "<ENTRA_APP_CLIENT_ID>"
  scopes:
    - "https://api.fabric.microsoft.com/Workspace.Read.All"
    - "https://api.fabric.microsoft.com/Item.ReadWrite.All"   # required for getDefinition (item code)
    - "https://api.fabric.microsoft.com/OneLake.Read.All"      # required for lakehouse shortcuts
    # The two below are only needed for the elevated-access ("admin") checks:
    # cloud connection credentials and on-premises gateways. Ordinary delegated
    # reads, NOT tenant-admin - but without them /connections and /gateways
    # return 403 and those checks report N/A instead of a verdict.
    - "https://api.fabric.microsoft.com/Connection.Read.All"
    - "https://api.fabric.microsoft.com/Gateway.Read.All"
