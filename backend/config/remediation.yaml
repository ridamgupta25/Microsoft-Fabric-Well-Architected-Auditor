# Pre-written remediation text keyed by checklist reference (no AI).
# Edit these strings to tune the guidance shown for each failing check.
#
# A missing key is not an error: the finding simply renders with an empty
# recommendation column. Every ref used by a check should therefore appear here.
"1.1.1": "Give each workspace a single, clear purpose for its layer and environment: keep the item types its role calls for, and move anything that belongs to another layer into that layer's workspace."
"1.1.9": "Keep a Data Prep workspace to Pipelines and Notebooks only — no Lakehouses or Warehouses; storage belongs in the Data Store workspace. Move any item types that belong to another layer out of this workspace."
"IMPL-24": "Name promotable workspaces with an environment tier — Dev, UAT, or Prod (only the tiers you use; a lone UAT is fine). Workspaces without a tier should read as their purpose instead: include 'Reporting' in the name of a reporting-only workspace, while a shared data / lakehouse workspace needs no tier. Keep the name internally consistent too: use one separator style (don't mix spaces with underscores) and clean per-word casing (avoid garbled casing like 'aRIGFHG')."
"IMPL-02": "Assign workspace roles to Microsoft Entra security groups instead of named individuals; move the listed users into an appropriate group."
"IMPL-06": "Reduce the number of Admin grants to the minimum required; prefer Contributor/Viewer and use security groups."
"1.3.5": "Run automation (pipelines, deployments) under a service principal or managed identity granted a workspace role, rather than personal accounts."
"IMPL-01": "Review and remove external/guest principals with workspace access; confirm each is required and time-bound."
"IMPL-04": "Apply sensitivity labels to every item, especially those holding confidential or PII data."
"6.2.1": "Define Row-Level Security (RLS) roles with DAX filter expressions on semantic models so users only see data they are authorized to access."
"6.2.2": "Define Object-Level Security (OLS) column permissions on semantic model roles to restrict access to sensitive fields such as PII or financial data."
"6.2.3": "Apply Dynamic Data Masking (DDM) to sensitive columns (e.g. email, SSN, credit card) in Warehouse tables so non-privileged users see masked values instead of raw PII."
"14.4.1": "Define Row-Level Security (RLS) roles with DAX filter expressions on reporting semantic models so each audience sees only the data they are authorized to access."
"14.4.3": "Apply Object-Level Security (OLS) column permissions on reporting semantic models to hide sensitive fields (PII, financials) from audiences that must not see them."
"14.1.1": "Set crossFilteringBehavior to single direction on semantic model relationships and replace bidirectional filters with a bridge table or a CROSSFILTER() measure, keeping bidirectional only where a many-to-many bridge genuinely requires it."
"14.1.3": "Centralize duplicated DAX: define each calculation once as a base measure and have the copies reference it (or use CALCULATE over the base measure) instead of repeating the same expression."
"14.1.4": "Refactor substantial DAX measures: declare intermediate steps with VAR ... RETURN so each sub-expression is named and evaluated once; replace CALCULATE(..., FILTER(Table, Table[Col] = x)) with a plain boolean filter argument; and avoid nesting one iterator (SUMX/AVERAGEX/RANKX...) inside another."
"11.1.1": "Connect the workspace to Git (Azure DevOps/GitHub) so all items are source-controlled."
"11.1.4": "Bind each workspace to the branch its role calls for under a written branching strategy: promoted environments (QA/UAT/Prod) track main/master or a release/* branch, development workspaces track a feature/* or develop branch, and no workspace is built from an ad-hoc personal branch. Rename or re-point the Git connection in Workspace settings > Git integration."
"11.2.1": "Assign the workspace to a Fabric deployment pipeline to gate promotion across dev/test/prod."
"11.4.2": "Ship Warehouse schema changes through automation rather than a query editor: connect the workspace to Git or a Fabric deployment pipeline, move CREATE/ALTER/DROP T-SQL into pipeline Script activities, and feed every environment-specific value (database, path, schema, connection) from pipeline parameters/expressions (@pipeline(), @variables(), @{...}) instead of literals."
"11.4.5": "Put semantic models under source control (Git integration or a deployment pipeline) so their definitions are versioned, and add a semantic-model refresh activity to the data-consumption pipeline so the model is rebuilt as a step of the flow rather than on an independent schedule."
"11.5.1": "Add unit tests for the critical transformation logic: extract the transforms into functions and cover them with a test notebook using a real framework (pytest, unittest, chispa, nutter, Great Expectations), then invoke that test notebook from the pipeline so a failing test blocks promotion. Row-count asserts on production data are a data-quality gate, not a substitute."
"1.1.3": "Enforce environment isolation: give each Dev/QA/Prod workspace its own copies of the artifacts it uses, and remove pipeline references (paths, connections, activity names, expressions) that point at another environment. Move the environment-specific values into pipeline parameters or deployment rules so promotion changes the target instead of hardcoding it."
"1.1.8": "Keep one store per purpose: consolidate the duplicated Lakehouses/Warehouses onto a single authoritative store and replace the copies with OneLake shortcuts or views. If a second store is genuinely required (for example a serving layer), rename it so its distinct purpose is explicit rather than a version or copy of the first."
"10.5.1": "Create a Data Activator (Reflex) item in the workspace and define triggers for the critical events it owns - pipeline/notebook failure, refresh failure, SLA breach, or a threshold on the data itself - with actions routed to Teams or email so a critical event reaches an owner."
"10.3.1": "Land high-volume or real-time telemetry in an Eventhouse / KQL database rather than only in a Lakehouse or Warehouse: create the Eventhouse, point the Eventstream at its KQL database, and keep the batch store for the aggregated history."
"10.3.2": "Save the KQL you run during an investigation as a KQL queryset (or a Real-Time Dashboard) in the workspace instead of an ad-hoc browser tab, and connect the workspace to Git so those querysets are versioned and reviewable."
"14.5.4": "Ship reporting content through both mechanics: connect the reporting workspace to Git (Azure DevOps/GitHub) so semantic models and reports have a diff and an author, and assign it to a Fabric deployment pipeline so content reaches QA and Prod by promotion rather than by being re-published by hand."
"IMPL-15": "Assign the workspace to a Fabric capacity appropriate for its environment."
"12.3.4": "Review and remove or archive orphaned items (no recent run/refresh) to reduce clutter and cost."
"2.1.1": "Rename the pipeline to follow the convention (e.g., PL_<Domain>_<Purpose>)."
"2.1.6": "Populate the pipeline description and add a description/annotation to every activity."
"2.1.2": "Replace hardcoded servers, paths, and connection strings with pipeline parameters and managed connections."
"2.4.1": "Configure a retry policy (>= 1) on activities that call external systems."
"2.4.2": "For activities that retry, set a bounded retry count (1-10) and a positive retryIntervalInSeconds so a transient error backs off instead of hammering or hanging."
"2.4.3": "Add an on-failure path (dependency condition = Failed) so activity failures are handled gracefully."
"2.4.4": "Route invalid or failed records to a durable dead-letter or quarantine output while allowing valid records to continue."
"2.4.5": "Add a failure notification (Teams / Email / Data Activator) so failures are alerted."
"2.4.6": "Make reruns idempotent with an atomic MERGE/upsert, deterministic batch key, overwrite-by-partition, or deduplication step before writing."
"IMPL-23": "Set an explicit activity timeout instead of leaving the multi-hour/7-day default."
"6.4.2": "Remove hardcoded credentials/secrets; use Azure Key Vault references or managed connections. Rotate any exposed secret immediately."
"6.3.4": "Configure every API and source connection to require TLS 1.2 or newer, and disable older protocol versions."
"3.1.2": "Parameterize the notebook (a 'parameters'-tagged cell, or notebookutils/mssparkutils widgets) so it can be promoted across environments."
"3.1.3": "Remove hardcoded secrets, connection strings, and endpoints from notebook cells; read them from Key Vault or notebook parameters."
"3.1.6": "Remove display()/show() from production execution paths; they force compute and slow runs."
"3.2.3": "Avoid collect()/toPandas()/count() on large DataFrames; they pull data to the driver. Aggregate or write to a table instead."
"3.2.7": "Replace wildcard imports (from x import *) with explicit imports."
"3.1.1": "Structure notebooks consistently: a parameters cell, markdown documentation, explicit imports, then logic and output."
"3.1.4": "Add markdown cells that explain the business logic, not just the code."
"3.1.5": "Extract reusable functions instead of a single monolithic script; keep cells focused."
"3.1.7": "Rename notebooks to a meaningful, consistent convention (e.g. NB_<Layer>_<Purpose>)."
"3.1.8": "Configure an execution timeout / max runtime so a hung Spark session cannot run indefinitely."
"5.1.10": "Write invalid or failed records to a durable quarantine/dead-letter table or path instead of dropping them or halting valid records."
"9.3.1": "Make notebook writes rerun-safe with MERGE/upsert, deterministic overwrite, or cleanup-before-write and run-level deduplication keys."
"9.3.3": "Bound every multi-write notebook so it cannot half-apply: wrap Warehouse/SQL work in an explicit BEGIN TRANSACTION ... COMMIT/ROLLBACK (or a connection with autocommit off), or write to staging tables and swap them in with one atomic rename/replace, or catch the failure and compensate for the partial writes (RESTORE TABLE ... VERSION AS OF, delete/truncate the rows just written). Individually atomic writes are not a boundary — a failure between them still leaves the set of tables inconsistent."
"7.2.6": "Add a source-to-target reconciliation for the financial data that compares source and target row counts or financial control totals and fails or alerts on any variance."
"3.2.1": "Pick one primary language (PySpark or Spark SQL) per notebook rather than mixing them."
"3.2.2": "Use the DataFrame API instead of the low-level RDD API for Catalyst optimization."
"3.2.4": "Add a broadcast() hint when joining a small dimension to a large fact table."
"3.2.5": "Replace Python UDFs with native Spark SQL functions where equivalents exist."
"3.2.6": "Define an explicit schema (StructType) for external CSV/JSON reads instead of inferring it."
"2.1.3": "Introduce a master/orchestrator pipeline that invokes and coordinates the dependent child pipelines."
"2.2.1": "Implement incremental loading (watermark, CDC, or merge/upsert) instead of unconditional full reloads."
"2.3.8": "Use event-time lookback and a version-aware MERGE or deduplication key so late and out-of-order changes cannot overwrite newer data or create duplicates."
"2.2.5": "Separate initial and incremental loads with a load-mode parameter or a branch (Switch/If)."
# -- MLC Cat-1: ingestion framework (2.1.5, 2.2.2-2.2.4, 2.3.2-2.3.4, 2.5.1, 2.5.3)
"2.1.5": "Let independent work run concurrently: clear isSequential on ForEach loops that do not need ordering (set a batchCount instead), and give independent activities their own dependency branch rather than one serial chain."
"2.2.2": "Reserve TRUNCATE/INSERT OVERWRITE and overwrite sinks for small reference and dimension tables; load fact tables incrementally with a watermark or MERGE."
"2.2.3": "Keep the historical/backfill load in its own pipeline, or gate it behind a load-mode parameter or branch, so a routine scheduled run cannot replay the full history."
"2.2.4": "Persist the watermark in a durable control/metadata table and read it back at the start of each run, rather than holding it in a pipeline variable that dies with the run."
"2.3.2": "Carry the source operation flag (I/U/D) through to Bronze as its own column so downstream layers can tell an update from an insert and can replay deletes."
"2.3.3": "Extend the MERGE to cover every operation the source emits — whenMatchedUpdate, whenNotMatchedInsert, and a delete branch (or a soft-delete flag) for removals."
"2.3.4": "Deduplicate the source batch on the business key (dropDuplicates or ROW_NUMBER() ... = 1) before the MERGE, so duplicate source rows cannot abort it."
"2.5.1": "Drive ingestion from a metadata/config table: a Lookup that reads the source list feeding a ForEach, so adding a source is a config row rather than a pipeline edit."
"2.5.3": "Write a run-control row for every load capturing batch ID, status, rows read/written, and start/end timestamps, so a failed run can be diagnosed and resumed."
"2.6.1": "Record each run's duration alongside the run-control row and compare it against an expected value (rolling average, p95 or an agreed SLA), alerting when a run exceeds it — a stored duration with nothing to compare it to is not monitoring."
"4.2.1": "Adopt one table naming convention (snake_case) and rename tables that deviate."
"4.1.1": "Use managed Delta tables for analytics; convert external/Parquet tables or document the exception."
"4.1.3": "Govern shortcuts with explicit path standards and ownership: avoid nested/recursive shortcut paths, avoid shortcut roots under Tables, and remove ambiguous or duplicate shortcut routes. Ensure Workspace.Read.All + OneLake.Read.All read-only visibility is available for structural verification of lakehouse Files hierarchy and shortcuts."
"4.1.4": "Separate Bronze and Silver responsibilities per domain load path: avoid a single domain shortcut route that mixes Bronze and Silver ownership, and document one canonical layer owner per domain ingestion path."
"4.1.5": "Standardize folder taxonomy for Bronze/Silver domain paths across shortcuts (for example bronze/<domain>/... and silver/<domain>/...): remove inconsistent naming, missing domain segments, and ad-hoc path variants so lineage and governance remain deterministic."
"4.2.2": "Define partitioning or clustering strategy for large tables explicitly (partition columns, clustering keys, or equivalent metadata) and keep the strategy consistent with query predicates; avoid relying on implicit defaults."
"4.2.5": "Add audit columns (created_date, modified_date, source_system, batch_id) to tables for lineage."
"4.4.1": "Organise the Warehouse into schemas by domain (sales, finance, hr...) rather than putting every table in dbo, and give landing/staging tables their own schema (stg / staging / landing) separate from the presentation schemas consumers query. Grant on the schema rather than table by table so the boundary is also a security boundary."
"4.4.8": "Build a date/calendar dimension with the attributes reporting needs (fiscal year, quarter, holidays)."
"4.2.3": "Rename table columns to a consistent snake_case convention so they are self-documenting."
"4.2.4": "Type date/time columns as date/timestamp (not string), and size text columns to the data instead of varchar(max), so comparisons, statistics and partition pruning work."
"4.4.3": "Right-size column data types: remove oversized text widths and set decimal precision/scale to business-appropriate ranges instead of overly wide defaults."
"4.4.4": "Implement surrogate keys on dimension tables with a repeatable generated-key pattern (hash/window/sequence/key-table mapping) and keep natural keys as descriptive attributes."
"4.4.5": "Declare fact-to-dimension key relationships where supported (PK/FK metadata or modeled relationships), and keep the relational structure explicit even when enforcement is not available."
"4.4.6": "Define and automate a Warehouse statistics maintenance strategy, including when statistics are created or refreshed and how maintenance is triggered after significant data changes."
"4.5.9": "For SCD Type 2 dimensions, include valid_from, valid_to and is_current and maintain them on each load."
"4.1.2": "Land data in OneLake instead of side doors: replace personal-gateway file connections, local/UNC paths, personal OneDrive/SharePoint drives and ad-hoc HTTP file pulls with a governed source or a OneLake shortcut. Then review every shortcut targeting storage outside OneLake (ADLS, Dataverse, S3) and confirm each is an intended, governed access path with an owner."
# -- Spark / Delta notebook + Copy-parallelism (promoted from roadmap) --------
"2.6.2": "Set parallelCopies and/or dataIntegrationUnits on Copy activities so large transfers use appropriate parallelism instead of the conservative defaults."
"3.3.1": "Replace sequential DELETE + INSERT/UPDATE with a single MERGE INTO so the upsert is atomic and avoids extra table rewrites."
"3.3.2": "Run OPTIMIZE (bin-compaction) on Delta tables after write-heavy operations to consolidate small files."
"3.3.3": "Schedule VACUUM to remove old, unreferenced Delta files and reclaim storage (keep the retention window your time-travel needs)."
"3.3.4": "Add ZORDER BY on the high-cardinality columns used in filters/joins when you OPTIMIZE, so data skipping is effective."
"3.3.5": "Confirm V-Order is enabled for read-heavy Gold tables (it is on by default in Fabric); set it explicitly where you rely on it."
"3.3.6": "Set Delta table properties (delta.autoOptimize.optimizeWrite / autoCompact) so writes stay compacted without a manual OPTIMIZE."
"3.3.7": "Configure delta.logRetentionDuration and deletedFileRetentionDuration deliberately rather than relying on defaults, and monitor history growth."
"3.4.1": "Manage Spark dependencies through a Fabric Environment instead of inline %pip/!pip installs, so libraries are shared, versioned, and reproducible."
"3.4.2": "Pin every installed library to an explicit ==version so runs are reproducible and not broken by a floating latest release."
"3.4.4": "Where the defaults do not fit the workload, tune Spark configuration (e.g. spark.conf.set(...)) and document why."
"3.4.5": "Select a current supported Fabric runtime and record the runtime version used by the notebook."
"3.4.3": "Size the Spark pool from observed workload and capacity metrics; reduce idle capacity or increase resources when jobs are constrained."
"3.5.2": "Set spark.sql.shuffle.partitions to suit the data volume instead of leaving the 200 default, which is wasteful for small/medium data."
"3.5.3": "Release cached/persisted DataFrames with unpersist() once they are no longer needed so executor memory is not held unnecessarily."
"3.5.4": "Use coalesce (to reduce) or repartition (to redistribute) before writes so output file sizes and partition counts are appropriate."
"3.5.5": "Filter on the table's partition columns before reading so Spark can prune partitions instead of scanning the full table."
"3.5.6": "Review Spark UI for key jobs and address skewed partitions, excessive spill, and inefficient shuffle stages."
"3.5.7": "Apply filter predicates immediately after spark.read on shortcut or external sources (e.g. .filter(), .where(), or a SQL WHERE clause) so the Spark Catalyst optimizer can push the predicate down to the data source and avoid a full table scan."
"3.5.9": "Project explicit columns instead of SELECT * so only the data you need is read and column pruning applies."
"3.6.1": "Define and enforce a consistent Warehouse load pattern for every Gold-layer pipeline: use COPY INTO for file-to-table bulk loads, CTAS for transformation-heavy one-time loads, a Copy activity for pipeline-orchestrated moves, or a stored procedure for complex multi-step loads. Mixed patterns without a documented rationale indicate a missing load-strategy decision."
"3.6.2": "Replace T-SQL cursors (DECLARE CURSOR / FETCH NEXT / WHILE @@FETCH_STATUS) and pandas row iterators (.iterrows() / .itertuples()) with set-based SQL operations (INSERT INTO ... SELECT, MERGE INTO, CTAS) or PySpark DataFrame transformations so the Spark/SQL engine can parallelize and optimize the operation."
"3.6.3": "Define and enforce a consistent Warehouse load pattern for every Gold-layer pipeline: use COPY INTO for file-to-table bulk loads, CTAS for transformation-heavy one-time loads, a Copy activity for pipeline-orchestrated moves, or a stored procedure for complex multi-step loads. Mixed patterns without a documented rationale indicate a missing load-strategy decision."
# Ref 3.6.4 is claimed by two checks from two different source checklists:
# NB-ORPHAN-DETECT (orphan child records) and PL-IDEMPOTENT (re-runnable loads).
# Remediation is keyed by ref, so this text has to serve both — they are both
# load-safety advice, so it reads coherently either way.
"3.6.4": "Make the load safe to re-run and orphan-aware: write with MERGE INTO (or TRUNCATE / DELETE-by-batch followed by INSERT) so re-running cannot duplicate rows, and detect orphan child records with an anti-join, routing unmatched keys to an error table or quarantine before loading."
"3.6.5": "Wrap Warehouse/lakehouse load procedures in explicit transaction and TRY...CATCH handling: BEGIN TRANSACTION, perform the DML (MERGE/INSERT/CTAS), COMMIT on success, and ROLLBACK plus logged error details in CATCH. For Fabric checks, request workspace Viewer access and client-approved SQL endpoint queries so procedure/error-handling logic can be verified."
"3.6.6": "Avoid full reloads of Warehouse targets when an incremental pattern is possible: replace unconditional INSERT/overwrite loads with MERGE INTO, CDC, or watermark-based processing so only changed rows are applied to the Gold table."
"3.6.7": "Update and maintain statistics after significant Warehouse loads so query performance remains stable."
"5.2.1": "Define and enforce the expected incoming schema, including column count, names, and data types, before processing records such as EAM JSON."
"5.2.4": "Validate incoming file format before processing: require UTF-8 encoding, the expected delimiter, and a valid JSON structure for EAM payloads."
"5.3.5": "Standardize incoming dates and codes with explicit conversions and normalization rules — e.g. to_date/to_timestamp/date_format for dates and upper/lower/trim/regexp_replace for codes."
"5.2.8": "Capture source metadata with every load, including a UTC ingestion timestamp, source system or file, and batch identifier."
"5.3.4": "Detect duplicate business records before writing by checking the business key and removing or routing duplicate rows."
"5.5.3": "Validate or explicitly configure UTF-8 handling for incoming string and text data before processing it."
"5.5.5": "Pin categorical and code columns to their expected domain before the write: test membership against a named allowed-value set (status.isin(VALID_STATUSES)) or anti-join the load against the reference/lookup/dimension table that owns the code list, and route the rows carrying an unknown code to a quarantine table instead of writing them onward. Keep the allowed values in one declared place (a constant or a reference table) rather than repeating literals per notebook, so a retired code is removed once. This is distinct from the Boolean/Flag point (5.5.7): a Y/N test does not constrain a multi-valued code column."
"5.5.7": "Restrict Boolean and Flag fields to the approved value set and route unexpected values for review instead of accepting them silently."
"1.2.3": "Write UTC ingestion timestamp, source system/file, and batch ID into every Bronze load so raw records remain traceable."
"1.2.5": "Apply cleansing, deduplication, conformance, and explicit type standardization before writing the Silver table."
"2.6.3": "Use bulk Copy/COPY INTO or bounded batch writes and avoid row-by-row loops for large data movements."
"2.6.6": "Parse EAM JSON with streaming, partitioning, or bounded-file controls such as maxFilesPerTrigger instead of processing one oversized file."
"4.6.4": "Write an audit-quality table for every load with batch/run ID, row counts, null checks, exception details, status, and timestamps."
"5.1.2": "Codify data-quality rules in reusable notebook code or configuration instead of relying on ad-hoc manual checks."
"9.1.1": "Persist checkpoints, watermarks, batch IDs, or restart boundaries so a failed pipeline can resume from the point of failure."
"10.1.4": "Connect a Failed dependency path to Data Activator, Teams, email, or webhook alerting and verify the destination is configured."
# -- MLC Cat-1 checklist points ------------------------------------------------
"9.1.3": "Enable Copy activity fault tolerance (skip incompatible rows and/or skip error files) and set redirect/log settings so the skipped rows are written somewhere, or route failures to a quarantine activity. One malformed record must not fail the whole run, and skipped records must never be discarded silently."
"9.1.4": "Compare table schemas across Dev, Test, and Production during promotion; reconcile approved additions/changes through version-controlled migrations and block unapproved drift."
"4.5.10": "Handle late-arriving data with the inferred-member pattern: when a fact's dimension key is not yet present, insert a stub dimension row (or substitute the conventional -1 unknown member) and backfill it when the real record arrives, rather than dropping the fact or failing the load."
"5.4.4": "Count how many rows land on the unknown/inferred member on each run and write that number to the audit tables, so a source feed that starts producing unmatched keys is detected instead of quietly inflating the unknown member."
"5.4.6": "Reconcile record counts across the Silver-to-Gold hop: capture the Silver source count, compare it against the Gold result (allowing for documented aggregation), and raise an alert when the two do not tie out."
"5.4.9": "Enforce the fact table's declared grain on load: deduplicate on the grain columns (dropDuplicates / ROW_NUMBER() = 1), or assert that a GROUP BY on the grain returns no group with COUNT(*) > 1, and fail the load when it does."
"4.5.12": "Validate fact foreign keys against the dimension before loading — an anti-join (left_anti) or a null check after a left join — and route unmatched keys to an error table. Fabric Warehouse allows FK constraints to be declared but does not enforce them, so nothing else prevents an orphan key being written."
"4.3.2": "Organise Lakehouse Files paths with a source/domain folder and a date hierarchy (yyyy/mm/dd, yyyy-mm-dd, or year=/month=/day=) so raw files can be pruned, retained and replayed by source and date."
"4.3.3": "Compact or repartition Lakehouse data files so most analytical files land in the 128MB-1GB target band; exclude Delta logs, CRC files, metadata and zero-byte markers from the data-file target."
"4.3.4": "Implement a scheduled archiving/purging routine for the Lakehouse Files section: delete or move files past the agreed retention window (mssparkutils.fs.rm, or an ADLS lifecycle policy). Note this is separate from VACUUM, which only reclaims Delta table files."
"5.4.1": "Use active fact-dimension surrogate-key relationships, and verify with SQL that non-null fact FKs have matching dimension keys (zero orphans)."
"5.4.1": "Use active fact-dimension surrogate-key relationships, and verify with SQL that non-null fact FKs have matching dimension keys (zero orphans)."
"5.2.5": "Add a record count reconciliation step after writing data — compare source and target row counts and raise an alert on mismatch."
"5.3.2": "Validate referential integrity by running an anti-join of FK values against the dimension/lookup table and handling any unmatched keys before loading."
"5.3.6": "When loading from multiple sources, reconcile record counts or hash totals across sources to detect missing or duplicated records."
"5.3.7": "Detect orphan child records (FK values with no matching parent) using an anti-join and route them to an error table or quarantine before proceeding."
"5.3.9": "After a MERGE INTO, validate the result by checking operationMetrics or DESCRIBE HISTORY to confirm inserted/updated/deleted counts match expectations."
"5.2.6": "Add duplicate detection before writing — dropDuplicates on the business key, a row_number() window keeping the latest version, or a groupBy key having count() > 1 assertion — so a re-run or an overlapping batch cannot double-load rows."
"5.3.1": "Cast columns to their target types explicitly (cast/to_date/to_timestamp or an explicit StructType) before writing, instead of relying on schema inference that can silently change type between runs."
"5.5.6": "Validate key columns before writing: assert the business/surrogate key has no nulls (filter on isNull) and no duplicates (dropDuplicates on the key or a count-per-key check), and quarantine rows that fail."
"5.3.3": "Codify the domain's cross-field rules in the notebook and apply them before the write: compare the two columns of a row against each other (col('start_date') <= col('end_date'), col('net') <= col('gross'), a SQL CASE WHEN / CHECK over two column identifiers) rather than only checking each field against a constant, and route the rows that break a rule to a quarantine table instead of loading them. Keep the rule set named and reusable (a business_rules(...) / validate_rule(...) helper) so the same rules run on every load."
"5.3.10": "Check for nulls where they can appear: straight after each join and each cast, count the nulls in the resulting frame's joined or cast columns (df.filter(col('dim_attr').isNull()).count() after a left join, the same after a .cast(...)) and fail or quarantine when the count exceeds what the design expects. A non-matching join key and a failed cast both produce nulls silently, so null handling elsewhere in the notebook does not cover them."
"5.5.8": "Validate EAM/JSON payloads at the point of ingestion: read them with an explicit StructType schema (or pass one to from_json) instead of inferring, assert the required elements are present (a required-fields list differenced against df.columns) and verify type coercion succeeded - use a parser mode that surfaces bad records (badRecordsPath / a _corrupt_record column / FAILFAST), or count the nulls produced by each cast - so a renamed element or an uncoercible value cannot land silently as null."
# -- MLC Cat-1: ingestion tuning (from dev) -----------------------------------
"2.6.5": "Tune each Copy activity that reads a SQL database: replace the plain table read with a sqlReaderQuery that names its columns and carries a WHERE predicate (or a stored procedure) so the source engine does the filtering; set a partitionOption (with a partition column the source is ordered/indexed on) so the read is split into ranges instead of one long stream; and set an explicit writeBatchSize/writeBatchTimeout on the sink instead of relying on the conservative default."
# -- MLC Cat-1: resilience + semantic model performance (9.1.2, 9.3.4, 14.2.x, 14.5.x)
"9.1.2": "Wrap remote/source calls in the notebook with a bounded retry that waits longer after each attempt (tenacity, or a loop with an exponential sleep), so a transient error does not fail the run and a retry does not hammer an already-overloaded source."
"9.3.4": "In any recovery, replay or backfill path, re-validate that the layers agree — compare row counts or keys across source and target and fail loudly on a mismatch — rather than assuming a partially-written layer is complete."
"14.2.1": "Settle on one storage mode per model (Direct Lake, Import, or DirectQuery) and document why; mixed modes without a deliberate dual/composite table cost both a refresh path and a query path."
"14.2.2": "Set directLakeBehavior explicitly on Direct Lake models. The default (automatic) lets a query silently fall back to DirectQuery and slow down with no error; directLakeOnly surfaces the guardrail breach instead."
"14.2.4": "Add aggregation tables (alternateOf) over the large detail tables in Import/DirectQuery models so common visuals hit a summary instead of scanning every row."
"14.2.6": "Bind model tables to a warehouse table or view rather than inline native SQL / Power Query. Inline logic re-runs on every refresh and hides the transformation from the warehouse where it could be tested and reused."
"14.5.1": "Trigger the semantic model refresh from the pipeline that loads Gold, sequenced after the load activities, so the refresh cannot start mid-load. An independently scheduled refresh can publish a half-written Gold layer."
"14.5.2": "Configure an incremental refresh policy (rolling window + incremental granularity) on large Import tables so each refresh loads only the changed window instead of the full history."
# -- Warehouse modelling, audit-store shape and ingestion volume ----------------
"1.2.6": "Model the Gold Warehouse as a star schema in the Warehouse itself — fact tables plus the conformed dimensions they reference — so the semantic layer in the consumption workspace binds to a modelled Warehouse rather than to flat staging output."
"1.2.8": "Give the audit tables (DQ logs, row counts, null checks, exceptions) their own Lakehouse/Warehouse instead of interleaving them with business tables, so audit data has a clear owner, retention and access model."
"4.4.9": "Build each conformed dimension once and share it across domains (a shortcut, a view, or a single Warehouse schema) instead of materialising a per-domain copy — duplicate copies drift apart and break cross-domain analysis."
"4.5.3": "Move descriptive text attributes off the fact table onto the dimension they describe, leaving the fact with foreign keys, measures and audit columns only."
"4.5.4": "Denormalise the dimension: fold the outrigger's attributes into the dimension itself rather than keying out to another dimension, unless the snowflake is a deliberate, documented exception (a very large or independently versioned outrigger)."
"4.5.8": "Decide and record the SCD strategy for each dimension (Type 1, Type 2 or hybrid) and make it visible in the schema — Type 2 dimensions carry validity dates and a current flag; a deliberate Type 1 should be documented so overwrite-in-place is a choice rather than a default."
"4.6.2": "Consolidate ingestion/orchestration configuration — source lists, watermarks, control and schedule tables — into one metadata store, and point every pipeline at it, instead of keeping config tables in several stores."
"4.6.8": "Design the audit tables for operational queries: a run/batch identifier, a run timestamp, and typed columns for counts and status, rather than a free-text or JSON payload column that has to be parsed before it can be filtered."
"5.1.4": "Compute a data-quality score per table/dataset on every run and append it to the audit lakehouse with the run timestamp, so quality can be trended instead of only reporting the latest value."
"10.3.4": "Record rows read, written and rejected for every ingestion run in the audit tables with a run timestamp, and compare each run's volume against the previous runs so a silent drop or an over-ingestion is detected rather than absorbed."

# -- Audit immutability, DQ consistency/gating, typed data quality and DR -------
"4.6.5": "Append to the audit tables and never rewrite them: replace UPDATE / DELETE / TRUNCATE / MERGE and overwrite-mode writes against audit, log and DQ tables with inserts (append mode), and correct a wrong row by writing a new corrective row rather than editing history."
"5.1.7": "Pick one data-quality library for the solution (e.g. Great Expectations, Soda, pydeequ, or a single in-house assertion helper), install it in the shared Spark Environment, and migrate the notebooks using other frameworks onto it so rules, results and failure handling have one shape."
"5.1.9": "Make a failed validation stop the run: wire downstream activities to the validation activity's Succeeded outcome (not Completed or Skipped), add a Fail activity on its Failed edge, and have validation notebooks raise on a bad result instead of printing it."
"5.2.7": "Declare an explicit schema that records which non-key fields may be null, and profile or assert nulls across the business attributes (fillna / dropna with a subset, a null-count per column) so an unexpected null is flagged rather than loaded."
"5.5.1": "Validate date values against a sensible range - a lower bound and current_date() for dates that must not be in the future - and handle timezones explicitly (to_utc_timestamp / from_utc_timestamp or a declared session timezone) instead of inheriting the Spark session default."
"5.5.2": "Type monetary values as DecimalType(p, s) rather than float or double so cents are not lost to binary floating point, and validate currency codes against an allowed set or the ISO 4217 three-letter pattern."
"5.5.4": "Hash, mask or tokenize personal data (sha2 with a salt, a masking function, or format-preserving tokenization) before it is written, and validate the format of well-shaped fields such as email, phone and national ID with an explicit pattern test."
"9.2.4": "Give the Gold layer a second copy: mirror the database, add a pipeline that exports the critical tables to ADLS/Blob on a schedule, or maintain a shortcut-backed copy outside the workspace - and test a restore from it."
"10.1.1": "Export pipeline run outcomes to a durable run-history table on every run - run id, pipeline name, status, start/end time and duration - so run history survives beyond Fabric's built-in retention window and can be trended."
"11.3.1": "Provision a separate workspace per layer per environment (Dev / QA / Prod) and put the tier in each workspace name, so promotion has a target and no environment shares mutable artifacts with another."

# -- Weak-signal points: grain, degenerate/junk dimensions, metadata-DB write
# -- access, arrival completeness/timeliness controls, and trend mechanics ------
"4.5.2": "Give every fact table an explicitly defined grain and make it readable from the schema — the foreign keys and the date key that together say what one row is — then write that grain down in the model documentation, since no Fabric or SQL endpoint API exposes a table description for a reviewer (or this auditor) to read back."
"4.5.11": "Review each fact column flagged here: a key with no dimension behind it is a degenerate dimension — keep it on the fact deliberately if the business key genuinely has no attributes, otherwise model the missing dimension; and where a fact carries several low-cardinality flag/status columns, collapse them into a junk dimension with a single key on the fact."
"4.6.3": "Restrict write access to the workspace holding the Metadata DB: grant Admin/Member/Contributor only to the framework's service principal or managed identity (and a small owning group), move named individual users to Viewer, and back that with SQL-level grants on the metadata tables themselves — the workspace role is the only layer this auditor can read."
"5.2.2": "Add a completeness control to the ingestion notebook: declare the files/partitions/source tables the run expects (from a manifest, a control table, or a generated date range), difference it against what was actually read, and raise or exit on anything missing so a short batch cannot be loaded silently."
"5.2.3": "Add a timeliness control: compute the age of the data just loaded (current_timestamp() minus the max load/event timestamp) and compare it against the agreed SLA window, raising or alerting when it is exceeded — a stored watermark alone makes the read incremental but notices nothing about lateness."
"10.4.4": "Give the monitoring semantic model the mechanics a trend needs: a proper date/calendar table marked as the date table, and measures using DAX time intelligence (DATEADD, SAMEPERIODLASTYEAR, TOTALYTD, DATESINPERIOD) so period-over-period comparison is possible instead of current-state-only reporting."
"11.1.2": "Connecting the workspace to Git is only half of source control: confirm every artifact type the workspace holds is one Fabric Git integration actually serialises, and move anything it does not cover (or that lives outside Fabric entirely, such as Warehouse schema scripts) into the repository by another route -- a SQL project/DACPAC or an exported definition committed alongside the workspace."

# -- promoted from self-assessment: observability + lineage + Warehouse audit ---
"7.2.3": "Turn on SQL auditing for the Warehouse holding financial data and configure an action group that records executed statements (BATCH_COMPLETED_GROUP), not only the authentication groups: auditing that captures logins alone cannot say what changed. Add the object/schema change groups alongside it so DDL and permission changes are covered too, and route the output to a store retained for as long as your finance policy requires."
"7.4.6": "Enable SQL auditing on every Warehouse that holds sensitive schemas (settings > SQL audit, or the sqlAudit setting via API), set a retention that matches your policy, and confirm the audit output lands somewhere durable -- the setting is per Warehouse, so a sensitive schema is only covered when the Warehouse holding it has auditing on."
"8.1.1": "Wire the data-processing items so Fabric can infer the flow: attach the lakehouse to the notebook and read/write tables by name (or via the /lakehouse/default/Tables mount) instead of a hard-coded abfss:// path, and have pipeline activities reference the notebook / lakehouse / warehouse item rather than a raw storage URL. Fabric's lineage view is built in and always on; it is the item wiring, not the feature, that makes it accurate."
"8.1.5": "Replace hard-coded cross-workspace paths and bare GUIDs with a named reference: create a OneLake shortcut (or reference the source item explicitly) so each cross-domain dependency is a first-class object with an owner. Then document the downstream side separately -- Fabric's lineage view shows an external source only one level upstream and no downstream cross-workspace consumer at all."
"10.1.5": "Monitor the Warehouse load jobs on all three axes: run them as scheduled Fabric jobs so duration and failure status are recorded, and write the rows each load moved (the Copy activity's rowsCopied, or @@ROWCOUNT after a MERGE/INSERT) into an audit table with a run timestamp, so a load that succeeds while moving no rows is still caught. Pair this with 10.1.1 so the record survives Fabric's own retention window."
"10.4.2": "Increase the run frequency of the jobs behind the monitoring data to hourly or better -- the cadence observed in their run history is what the dashboard actually reflects, regardless of what the schedule says. Where hourly batch is impractical, move the monitoring model to DirectQuery over the Eventhouse/KQL database, and check the runs are actually completing rather than silently failing."

# -- MLC batch: model column shape, refresh alerting, schedule spread, keyed upsert
"14.2.3": "Reduce the columns whose shape is inherently one-value-per-row. Drop GUID and identity columns no relationship uses; split a full-precision datetime into a date key plus a separate time key so two small dictionaries replace one enormous one; and leave free-text columns (description, comment, address, url, varchar(max)) out of the model unless a report genuinely displays them. Note this is judged from the column declarations, not from a measured distinct-value count -- confirm the real cardinality in the model before removing anything."
"14.5.3": "Set the semantic model refresh schedule notification to mail on failure (Settings > Refresh > Send refresh failure notifications), and point it at the owning team rather than a single individual, so a failed refresh does not quietly serve stale data. Where the refresh is driven by a pipeline instead of its own schedule, give the refresh activity an on-failure path that notifies; a Data Activator (Reflex) alert on the model is the equivalent for models with no schedule."
"2.6.4": "Stagger the run times so the workload is spread rather than piling into one window. Move jobs off the top of the hour and off each other by offsetting their schedules per domain, and sequence dependent work through a pipeline instead of scheduling each item independently at the same minute. This is judged from the runs actually observed, so also confirm the jobs are not simply queueing behind a saturated capacity."
"9.3.2": "Make the write itself keyed: replace a blind append (df.write.mode(append), INSERT INTO, a Copy sink with no upsertSettings) with a MERGE/upsert matched on the business key -- MERGE INTO target USING source ON target.key = source.key, the Delta merge().whenMatchedUpdate().whenNotMatchedInsert() API, or a Copy activity with writeBehavior upsert and explicit upsertSettings.keys. Where a full reload is genuinely intended, use a keyed replace (replaceWhere or dynamic partition overwrite) so a re-run rewrites only the rows that run owns."

# -- semantic-model relationship/organisation, medallion, warehouse schemas, capacity
"14.1.2": "Remove the second active filter path: for each table pair named in the evidence, keep one relationship active and set the others inactive (reaching them from a measure with USERELATIONSHIP), or break the loop by removing the redundant relationship and letting the filter propagate through the shared dimension. Where two facts need to share a dimension, conform the dimension once and relate both facts to it rather than relating the facts to each other. Confirm cardinality on each remaining relationship in the model view -- it is not readable from the model definition this auditor parses."
"14.1.8": "Hide the technical columns from report consumers: set isHidden on surrogate keys, GUIDs and any column that exists only to make a relationship work, so nobody drags a key onto a visual. Then organise what remains with display folders on measures and columns, and give every visible object a business-friendly name -- display folders are not readable from the parsed model definition, so confirm that half in the model view."
"12.3.3": "Tune the Fabric Environment's Spark compute so a session releases what it is not using: enable dynamic executor allocation and set the minimum executor count as low as the workload tolerates (1-2), rather than pinning a fixed executor fleet that bills for the whole session. Then set a session/idle expiration in the workspace Spark settings so an abandoned interactive session cannot hold the pool -- that timeout is not part of the Environment definition and must be confirmed in the workspace settings."
"1.1.5": "Make the medallion layers visible in the estate: name each store for the tier it serves (Bronze/Raw, Silver/Cleansed, Gold/Curated) or give each tier its own workspace named for it, and put each tier on the store type it calls for -- Bronze and Silver as Lakehouses, the Gold serving layer as a Warehouse. Then enforce the boundary in the pipelines: a Silver job reads Bronze and writes Silver only, never straight from source to Gold."
"12.2.1": "Install the Microsoft Fabric Capacity Metrics App from AppSource against each capacity, and give someone the standing job of reviewing it -- CU utilisation, throttling and overage trends -- on an agreed cadence. Record which workspace holds the app so a reviewer can find it; the app is normally installed once in an admin workspace, so its absence from a given workspace says nothing about the tenant."
"12.2.7": "Create a Data Activator (Reflex) alert on capacity utilisation -- from the Capacity Metrics semantic model, trigger when CU usage or throttling crosses the threshold your capacity can absorb -- and route it to the capacity admin so overload is acted on before the capacity throttles interactive users. Name the alert for what it watches, since the trigger condition itself is not readable from the item inventory."
"4.4.2": "Agree one naming convention for the Warehouse -- snake_case or PascalCase, either is fine -- and apply it to every table and column, including the ones inherited from an imported spreadsheet or an external source. Rename the outliers (or expose them through views that use the house style) so consumers do not have to guess the spelling of a column."

# -- Gold-layer controls, pipeline self-documentation, abstraction and reuse ----
"5.3.8": "Add a run-over-run volume control: read the previous run's row count back from the audit/control table, compare this run's count against it (an absolute delta or a percentage change against an agreed tolerance), and fail or alert on an unexplained shrinkage. Reconciling against the source in the same run (5.2.5) does not cover this -- both sides can shrink together."
"5.4.7": "Agree a freshness SLA for the serving (Gold) layer and make the refresh meet it: schedule the Warehouse/Lakehouse load and the semantic-model refresh so every serving item updates inside the window, alert when a scheduled run does not complete, and set gold_freshness_sla_hours in the project settings to the window you actually committed to (default 48h). An item that has not run for days is serving yesterday's numbers as today's."
"2.1.4": "Rename the activities Fabric generated for you ('Copy data1', 'Notebook3', 'Untitled') to say what the step does with what ('Copy Sales To Bronze', 'Load Dim Customer'), and group related steps inside container activities (ForEach / If Condition / Switch / Until) instead of leaving a long flat list on the canvas. Descriptions (2.1.6) are a separate control: an annotation you must open the properties pane to read does not make the canvas self-documenting."
"4.4.7": "Put a view (or stored procedure) layer between the physical tables and the semantic models/reports, and keep those definitions in source-controlled code -- a pipeline Script activity or a notebook -- rather than typing them into the SQL editor, so a column rename or retype is absorbed by the view instead of breaking every downstream report. Note that view metadata is not fetched by this auditor, so confirm existing views in the SQL editor before acting on a low score."
"14.3.4": "Point the reports at one shared semantic model per domain instead of letting each report carry its own private extract: rebind the one-off reports to the shared model (Power BI Desktop -> Transform -> Data source settings, or republish against the shared dataset), delete the orphaned extracts, and certify the surviving model. Sharing is what is scored here -- endorsement is not readable from the standard datasets API, so certify the model separately."
