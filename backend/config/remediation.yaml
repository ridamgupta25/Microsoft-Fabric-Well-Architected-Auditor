# Pre-written remediation text keyed by checklist reference (no AI).
# Edit these strings to tune the guidance shown for each failing check.
#
# A missing key is not an error: the finding simply renders with an empty
# recommendation column. Every ref used by a check should therefore appear here.
"1.1.2": "Align the workspace with its layer role: move items that belong to another layer into that layer's workspace, and make sure this one holds the item types its role calls for."
"1.1.7": "Name promotable workspaces with an environment tier — Dev, UAT, or Prod (only the tiers you use; a lone UAT is fine). Workspaces without a tier should read as their purpose instead: include 'Reporting' in the name of a reporting-only workspace, while a shared data / lakehouse workspace needs no tier. Keep the name internally consistent too: use one separator style (don't mix spaces with underscores) and clean per-word casing (avoid garbled casing like 'aRIGFHG')."
"6.1.2": "Assign workspace roles to Microsoft Entra security groups instead of named individuals; move the listed users into an appropriate group."
"6.1.8": "Reduce the number of Admin grants to the minimum required; prefer Contributor/Viewer and use security groups."
"6.1.3": "Run automation (pipelines, deployments) under a service principal or managed identity granted a workspace role, rather than personal accounts."
"6.1": "Review and remove external/guest principals with workspace access; confirm each is required and time-bound."
"6.2.4": "Apply sensitivity labels to every item, especially those holding confidential or PII data."
"6.2.1": "Define Row-Level Security (RLS) roles with DAX filter expressions on semantic models so users only see data they are authorized to access."
"6.2.2": "Define Object-Level Security (OLS) column permissions on semantic model roles to restrict access to sensitive fields such as PII or financial data."
"6.2.3": "Apply Dynamic Data Masking (DDM) to sensitive columns (e.g. email, SSN, credit card) in Warehouse tables so non-privileged users see masked values instead of raw PII."
"6.2.7": "Define Row-Level Security (RLS) roles with DAX filter expressions on reporting semantic models so each audience sees only the data they are authorized to access."
"6.2.8": "Apply Object-Level Security (OLS) column permissions on reporting semantic models to hide sensitive fields (PII, financials) from audiences that must not see them."
"11.1.2": "Connect the workspace to Git (Azure DevOps/GitHub) so all items are source-controlled."
"11.2": "Assign the workspace to a Fabric deployment pipeline to gate promotion across dev/test/prod."
"12.1": "Assign the workspace to a Fabric capacity appropriate for its environment."
"12.3.4": "Review and remove or archive orphaned items (no recent run/refresh) to reduce clutter and cost."
"2.1.1": "Rename the pipeline to follow the convention (e.g., PL_<Domain>_<Purpose>)."
"2.1.6": "Populate the pipeline description and add a description/annotation to every activity."
"2.1.2": "Replace hardcoded servers, paths, and connection strings with pipeline parameters and managed connections."
"2.4.1": "Configure a retry policy (>= 1) on activities that call external systems."
"2.4.2": "For activities that retry, set a bounded retry count (1-10) and a positive retryIntervalInSeconds so a transient error backs off instead of hammering or hanging."
"2.4.3": "Add an on-failure path (dependency condition = Failed) so activity failures are handled gracefully."
"2.4.5": "Add a failure notification (Teams / Email / Data Activator) so failures are alerted."
"2.4": "Set an explicit activity timeout instead of leaving the multi-hour/7-day default."
"6.4.2": "Remove hardcoded credentials/secrets; use Azure Key Vault references or managed connections. Rotate any exposed secret immediately."
"3.1.2": "Parameterize the notebook (a 'parameters'-tagged cell, or notebookutils/mssparkutils widgets) so it can be promoted across environments."
"3.1.3": "Remove hardcoded secrets, connection strings, and endpoints from notebook cells; read them from Key Vault or notebook parameters."
"3.1.6": "Remove display()/show() from production execution paths; they force compute and slow runs."
"3.2.3": "Avoid collect()/toPandas()/count() on large DataFrames; they pull data to the driver. Aggregate or write to a table instead."
"3.2.7": "Replace wildcard imports (from x import *) with explicit imports."
"3.1.1": "Structure notebooks consistently: a parameters cell, markdown documentation, explicit imports, then logic and output."
"3.1.4": "Add markdown cells that explain the business logic, not just the code."
"3.1.5": "Extract reusable functions instead of a single monolithic script; keep cells focused."
"3.1.7": "Rename notebooks to a meaningful, consistent convention (e.g. NB_<Layer>_<Purpose>)."
"3.1.8": "Configure an execution timeout / max runtime so a hung Spark session cannot run indefinitely."
"3.2.1": "Pick one primary language (PySpark or Spark SQL) per notebook rather than mixing them."
"3.2.2": "Use the DataFrame API instead of the low-level RDD API for Catalyst optimization."
"3.2.4": "Add a broadcast() hint when joining a small dimension to a large fact table."
"3.2.5": "Replace Python UDFs with native Spark SQL functions where equivalents exist."
"3.2.6": "Define an explicit schema (StructType) for external CSV/JSON reads instead of inferring it."
"2.1.3": "Introduce a master/orchestrator pipeline that invokes and coordinates the dependent child pipelines."
"2.2.1": "Implement incremental loading (watermark, CDC, or merge/upsert) instead of unconditional full reloads."
"2.2.4": "Separate initial and incremental loads with a load-mode parameter or a branch (Switch/If)."
"4.2.1": "Adopt one table naming convention (snake_case) and rename tables that deviate."
"4.1.1": "Use managed Delta tables for analytics; convert external/Parquet tables or document the exception."
"4.2.5": "Add audit columns (created_date, modified_date, source_system, batch_id) to tables for lineage."
"4.4.1": "Model the Gold layer as a star schema — separate fact tables from dimension tables, not flat wide tables."
"4.4.8": "Build a date/calendar dimension with the attributes reporting needs (fiscal year, quarter, holidays)."
"4.4.7": "Give each dimension a surrogate key (e.g. <dim>_sk) instead of using the business key as the fact FK."
"4.2.3": "Rename table columns to a consistent snake_case convention so they are self-documenting."
"4.2.4": "Type date/time columns as date/timestamp (not string) so comparisons and partition pruning work."
"4.4.10": "For SCD Type 2 dimensions, include valid_from, valid_to and is_current and maintain them on each load."
# -- Spark / Delta notebook + Copy-parallelism (promoted from roadmap) --------
"2.6.2": "Set parallelCopies and/or dataIntegrationUnits on Copy activities so large transfers use appropriate parallelism instead of the conservative defaults."
"3.3.1": "Replace sequential DELETE + INSERT/UPDATE with a single MERGE INTO so the upsert is atomic and avoids extra table rewrites."
"3.3.2": "Run OPTIMIZE (bin-compaction) on Delta tables after write-heavy operations to consolidate small files."
"3.3.3": "Schedule VACUUM to remove old, unreferenced Delta files and reclaim storage (keep the retention window your time-travel needs)."
"3.3.4": "Add ZORDER BY on the high-cardinality columns used in filters/joins when you OPTIMIZE, so data skipping is effective."
"3.3.5": "Confirm V-Order is enabled for read-heavy Gold tables (it is on by default in Fabric); set it explicitly where you rely on it."
"3.3.6": "Set Delta table properties (delta.autoOptimize.optimizeWrite / autoCompact) so writes stay compacted without a manual OPTIMIZE."
"3.3.7": "Configure delta.logRetentionDuration and deletedFileRetentionDuration deliberately rather than relying on defaults, and monitor history growth."
"3.4.1": "Manage Spark dependencies through a Fabric Environment instead of inline %pip/!pip installs, so libraries are shared, versioned, and reproducible."
"3.4.2": "Pin every installed library to an explicit ==version so runs are reproducible and not broken by a floating latest release."
"3.4.4": "Where the defaults do not fit the workload, tune Spark configuration (e.g. spark.conf.set(...)) and document why."
"3.5.2": "Set spark.sql.shuffle.partitions to suit the data volume instead of leaving the 200 default, which is wasteful for small/medium data."
"3.5.3": "Release cached/persisted DataFrames with unpersist() once they are no longer needed so executor memory is not held unnecessarily."
"3.5.4": "Use coalesce (to reduce) or repartition (to redistribute) before writes so output file sizes and partition counts are appropriate."
"3.5.9": "Project explicit columns instead of SELECT * so only the data you need is read and column pruning applies."
"3.6.1": "Add a record count reconciliation step after writing data — compare source and target row counts and raise an alert on mismatch."
"3.6.2": "Validate referential integrity by running an anti-join of FK values against the dimension/lookup table and handling any unmatched keys before loading."
"3.6.3": "When loading from multiple sources, reconcile record counts or hash totals across sources to detect missing or duplicated records."
"3.6.4": "Detect orphan child records (FK values with no matching parent) using an anti-join and route them to an error table or quarantine before proceeding."
"3.6.5": "After a MERGE INTO, validate the result by checking operationMetrics or DESCRIBE HISTORY to confirm inserted/updated/deleted counts match expectations."
